name: Build CV documents

on:
  push:
    branches: [main]
    paths: ['cv.yaml', 'build.py', 'convert.sh', 'prose/**', 'assets/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install dependencies
        run: |
          pip install pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-fonts-recommended \
            fonts-atkinson-hyperlegible fonts-liberation
          fc-cache -f

      - name: Generate markdown
        run: python3 build.py

      # Fonts and pandoc flags live in convert.sh so CI and local builds agree.
      - name: Convert to docx and pdf
        run: ./convert.sh

      - name: Commit generated files
        run: |
          git config user.name "cv-bot"
          git config user.email "actions@github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Rebuild CV outputs [skip ci]"
          git push
