name: Build CV documents

on:
  push:
    branches: [main]
    paths: ['cv.yaml', 'build.py', 'prose/**', 'assets/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install dependencies
        run: |
          pip install pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-fonts-recommended fonts-liberation

      - name: Generate markdown
        run: python build.py

      - name: Convert to docx and pdf
        run: |
          cd output
          for f in Bergmann-CV-Complete Bergmann-CV-OCGS Bergmann-SSHRC-Contributions Bergmann-CV-FullRecord; do
            pandoc "$f.md" -o "$f.docx" --reference-doc=../assets/reference.docx
            pandoc "$f.md" -o "$f.pdf" --pdf-engine=xelatex \
              -H ../assets/pdf-style.tex \
              -V mainfont="Liberation Serif" -V fontsize=12pt \
              -V geometry:margin=0.75in -V papersize=letter
          done

      - name: Commit generated files
        run: |
          git config user.name "cv-bot"
          git config user.email "actions@github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Rebuild CV outputs [skip ci]"
          git push
