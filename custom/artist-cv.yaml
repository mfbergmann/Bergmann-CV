# Artist CV, cut short — a starting point for applications with a page limit.
# Not published: the README serves the full artist CV, and anything size-specific
# gets built on request. Copy this file and adjust rather than editing it in
# place; the copy records how that application was framed.
#
# Build:  python3 .claude/skills/bergmann-cv/scripts/custom_cv.py \
#           custom/artist-cv.yaml --docx --pdf

# Year-only dates in the left column. Specific runs of dates already live in
# the citations, so repeating them beside every line is noise.
dates: year

contact_email: email_personal

title: "Artist CV"
# Name the application and its date here before sending.
subtitle: "Performance, projection, and machine collaboration"

sections:
  # Curation is by `selected:`, not recency: an arts jury wants the
  # career-defining work, and the strongest credits are not the newest.
  - heading: "Selected Works"
    from: all
    flags: [selected]

  - heading: "Residencies"
    from: [invited_positions, archive_residencies]

  - heading: "Awards"
    from: awards

  - heading: "Collectives and Affiliations"
    from: memberships
    # Excluding rather than matching, so a membership added later is included by
    # default instead of silently dropping out of this CV.
    exclude: 'Artificial Intelligence Association|Diagonal'

  - heading: "Selected Press"
    from: interviews
    limit: 6

  - heading: "Education"
    from: education
